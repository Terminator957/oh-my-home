<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="392" height="196" viewBox="0 0 196 98" role="img" aria-label="GitHub contribution snake">
  <title>GitHub Contribution Snake (demo)</title>
  <style>
    .cell { fill:#ebedf0; }
    /* 每个格子的动画延迟由 --i 控制，产生“蛇”遍历效果 */
    .cell {
      animation-name: snake;
      animation-duration: 4s;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
      animation-delay: calc(var(--i) * 0.03s);
    }
    @keyframes snake {
      0%   { fill: #216e39; } /* high */
      10%  { fill: #216e39; }
      30%  { fill: #7bc96f; } /* mid */
      50%  { fill: #c6e48b; } /* low */
      70%  { fill: #ebedf0; } /* empty */
      100% { fill: #ebedf0; }
    }
    /* 可选：在鼠标悬停时加速动画，便于交互查看 */
    svg:hover .cell { animation-duration: 2s; }
  </style>

  <!-- 14 列 × 7 行，单元格大小 12，间距 2 -->
  <!-- 行优先（从上到下），列从左到右，--i 按顺序递增以产生“蛇”扫描延迟 -->
  <!-- row 0 -->
  <rect x="0"   y="0"  width="12" height="12" class="cell" style="--i:0"/>
  <rect x="14"  y="0"  width="12" height="12" class="cell" style="--i:1"/>
  <rect x="28"  y="0"  width="12" height="12" class="cell" style="--i:2"/>
  <rect x="42"  y="0"  width="12" height="12" class="cell" style="--i:3"/>
  <rect x="56"  y="0"  width="12" height="12" class="cell" style="--i:4"/>
  <rect x="70"  y="0"  width="12" height="12" class="cell" style="--i:5"/>
  <rect x="84"  y="0"  width="12" height="12" class="cell" style="--i:6"/>
  <rect x="98"  y="0"  width="12" height="12" class="cell" style="--i:7"/>
  <rect x="112" y="0"  width="12" height="12" class="cell" style="--i:8"/>
  <rect x="126" y="0"  width="12" height="12" class="cell" style="--i:9"/>
  <rect x="140" y="0"  width="12" height="12" class="cell" style="--i:10"/>
  <rect x="154" y="0"  width="12" height="12" class="cell" style="--i:11"/>
  <rect x="168" y="0"  width="12" height="12" class="cell" style="--i:12"/>
  <rect x="182" y="0"  width="12" height="12" class="cell" style="--i:13"/>

